version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: dlm-backend-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: teja512
      POSTGRES_DB: dml
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Caching Engine
  redis:
    image: redis:7-alpine
    container_name: dlm-backend-redis
    restart: always
    ports:
      - "6379:6379"

  # 3. Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: dlm-backend-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  # 4. Kafka Event Bus Broker
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: dlm-backend-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_HOST://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # 5. Express API Microservice
  backend:
    image: ghcr.io/${IMAGE_OWNER:-teja}/dlm-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dlm-backend-service
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    expose:
      - "5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: teja512
      PGDATABASE: dml
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: dlm_super_secret_jwt_key_2026_production_ready

  # 6. Nginx API Gateway & Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: dlm-backend-nginx
    restart: always
    depends_on:
      - backend
    ports:
      - "5000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
