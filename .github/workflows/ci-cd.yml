name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: backend-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/dlm-backend

jobs:
  build-and-publish:
    name: Build, Test and Publish Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # 1. Checkout repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js 20
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Run automated test suite
      - name: Run Test Suite
        run: npm test

      # 5. Compile TypeScript
      - name: Compile TypeScript
        run: npm run build

      # 6. Set up QEMU for multi-arch OCI compatibility
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 7. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 8. Authenticate to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 9. Build and push Multi-Arch Docker image to GHCR
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
